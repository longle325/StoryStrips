services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: storystrip-backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: storystrip-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped
